name: Bug report
description: Report a software or hardware problem with the exact build and relevant logs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Fedora images are alpha software and are not suitable for daily use.
        Read the [short reporting guide](https://github.com/MCC45TR/uke-linux/blob/main/CONTRIBUTING.md) and [hardware status](https://github.com/MCC45TR/uke-linux#hardware-support) first.
        Report one problem per issue. Do not repeat a crash, change partitions or perform an unsafe test to complete this form.
        Remove credentials, unit identifiers, network identities, personal paths and calibration data from every attachment. Use private security reporting for vulnerabilities.
  - type: input
    id: component
    attributes:
      label: Component and release
      description: Fedora, kernel, hardware support, OrangeFox or Aloha; include the release tag and any later package updates or local changes.
      placeholder: Fedora Alpha 1, release tag, kernel revision, unchanged or modified
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: Image filenames and SHA-256 values
      description: Include both the system image and selected boot image. For a source build, provide the source commit and configuration instead. Write not applicable for an unrelated component.
      placeholder: |
        System image: filename — SHA-256
        Boot image: filename — SHA-256
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Device and firmware profile
      description: Record the POCO Pad X1 or Xiaomi Pad 7 model, RAM/storage variant and exact firmware version when relevant.
      placeholder: Device model, RAM/storage SKU, firmware version
    validations:
      required: true
  - type: input
    id: boot_target
    attributes:
      label: Root partition label and boot slot
      description: State linux or userdata and the selected slot, if relevant. The userdata variant is untested. Write unknown if unsure; do not modify partitions to answer.
      placeholder: linux, slot B
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest safe sequence and frequency, for example 2 failures in 3 attempts. Do not force another failure to complete the report.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual result and hardware conditions
      description: Describe what happened, when it happened, whether the clock was correct, power source/accessories/display mode, and whether touch, console or SSH still worked. Identify physical-device or VM testing.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Kernel version and reviewed evidence
      description: Include uname -r and Fedora version, relevant journal/dmesg excerpts or a photo of the last error. Follow the reporting guide; attach only redacted excerpts. Say if a shell or logs were unavailable.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Attachment review
      options:
        - label: I checked the text and attachments for credentials, unit identifiers, network identities, personal paths and calibration data.
          required: true
