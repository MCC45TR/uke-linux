name: Validate workspace links
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Verify component checkouts and the public landing layout
        run: |
          set -euo pipefail
          for component in recovery-uke-ofox senemos-uke-kernel uke-project-aloha uke-fedora-builder uke-linux-hardware-support uke-linux-images; do
            test -f "$component/README.md"
            git -C "$component" rev-parse --verify HEAD >/dev/null
          done
          test ! -e docs
          test ! -e AGENTS.md
          test ! -e PLAN.md
          test ! -e packages
          test "$(git config -f .gitmodules --get submodule.uke-linux-hardware-support.path)" = uke-linux-hardware-support
          test ! -e senemeos.sh
          test -x senemos-uke-kernel/senemos.sh
          bash -n senemos-uke-kernel/senemos.sh
          test -x ukelinux.sh
          bash -n ukelinux.sh
      - name: Validate Core image entry contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep shellcheck
          ./ukelinux.sh --self-test
          ./ukelinux.sh --build core --distro=fedora --offline --dry-run
          shellcheck ukelinux.sh uke-fedora-builder/src/image/*.sh uke-fedora-builder/src/audit/*.sh uke-fedora-builder/tests/*.sh
